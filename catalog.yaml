# AI on K8s — Model & App Catalog
#
# Each entry describes one deployable Kustomize directory.
# Fields:
#   id           unique kebab-case identifier
#   path         path from repo root (kubectl apply -k <path>)
#   type         model | app
#   name         display name
#   description  one-line description (apps only)
#   hf_id        HuggingFace model ID (models only)
#   hardware     nvidia | amd | intel | tenstorrent | any
#   vram_gb      total GPU VRAM across all GPUs (omit for Tenstorrent)
#   gpu_count    total GPUs across all nodes (omit for Tenstorrent and apps)
#   nodes        number of nodes (default: 1)
#   topology     single-node | multi-node
#   tensor_parallel   TP degree
#   pipeline_parallel PP degree (multi-node only)
#   precision    fp16 | fp8 | mxfp4 (omit for default fp16)
#   tt_device    Tenstorrent device name (TT configs only)
#   categories   list from: chat coding reasoning vision moe agent ui gateway
#   tags         free-form string list for search

