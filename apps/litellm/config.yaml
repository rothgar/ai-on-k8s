apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    model_list: []
    # Add models by patching this ConfigMap in your cluster repo. Example:
    #
    # model_list:
    #   - model_name: qwen3-35b
    #     litellm_params:
    #       model: openai/qwen3-35b
    #       api_base: http://vllm.qwen3-35b.svc.cluster.local:8000/v1
    #       api_key: placeholder
    #   - model_name: gemma-4-9b
    #     litellm_params:
    #       model: openai/gemma-4-9b-it
    #       api_base: http://vllm.gemma-4-9b-it.svc.cluster.local:8000/v1
    #       api_key: placeholder
    #
    litellm_settings:
      drop_params: true
      request_timeout: 600
