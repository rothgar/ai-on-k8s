apiVersion: apps/v1
kind: Deployment
metadata:
  name: substrate
  namespace: substrate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: substrate
  template:
    metadata:
      labels:
        app: substrate
    spec:
      serviceAccountName: substrate
      containers:
        - name: substrate
          image: ghcr.io/agent-substrate/substrate:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: OPENAI_API_BASE
              value: "http://litellm.litellm.svc.cluster.local:4000/v1"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: substrate-api-key
                  key: apiKey
                  optional: true
            - name: SUBSTRATE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
