                serviceAccountName: tt-operator-tt-k8s-driver-manager-controller
                priorityClassName: system-cluster-critical
                containers:
                  - name: manager
                    image: "ghcr.io/tenstorrent/tt-k8s-driver-manager:0.0.5"
                    imagePullPolicy: IfNotPresent
                    args:
                      - --leader-elect=false
                      - --health-probe-bind-address=:8081
                      - --metrics-bind-address=:8080
                    env:
                      - name: OPERATOR_NAMESPACE
                        valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
                      - name: DRIVER_IMAGE
                        value: "ghcr.io/tenstorrent/tt-k8s-driver-manager-builder:0.0.5"
                      - name: FLASHER_IMAGE
                        value: "ghcr.io/tenstorrent/tt-k8s-driver-manager-flasher:0.0.5"
                      - name: REQUIRE_TT_PCI_LABEL
                        value: "true"
                      - name: INSTALLER_SERVICE_ACCOUNT
                        value: tt-operator-tt-k8s-driver-manager-installer
                      # Deploy gates the driver controller flips per-node during a
                      # kmd upgrade (NVIDIA gpu-operator pattern). Set on values
                      # only — unset means "use the controller's compiled-in
                      # default" (today: tenstorrent.com/deploy.tt-telemetry). An
                      # explicit empty list disables the feature.
                      - name: DRIVER_DEPLOY_GATES
                        value: "tenstorrent.com/deploy.tt-telemetry"
                    ports:
                      - { name: metrics, containerPort: 8080 }
                      - { name: probe,   containerPort: 8081 }
                    livenessProbe:
                      httpGet: { path: /healthz, port: probe }
                      initialDelaySeconds: 15
                    readinessProbe:
                      httpGet: { path: /readyz, port: probe }
                      initialDelaySeconds: 5
                    resources:
                      limits:
                        cpu: 500m
                        memory: 256Mi
                      requests:
                        cpu: 50m
                        memory: 64Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities: { drop: ["ALL"] }
                      readOnlyRootFilesystem: true
                      runAsNonRoot: true

    # tt-telemetry aggregator Deployment and Ingress omitted — they contain multi-node
    # placeholder hostnames that must be configured per-cluster before use.
    # Helm hook resources (post-delete) stripped — not applicable outside Helm.

    - name: tt-telemetry
      mode: one-time
      inline:
        - apiVersion: v1
          kind: Service
          metadata:
            name: tt-telemetry-service
            namespace: tt-operator-system
            labels:
              app: tt-telemetry-service
              helm.sh/chart: tt-telemetry-0.1.1
              app.kubernetes.io/name: tt-telemetry
              app.kubernetes.io/instance: tt-operator
              app.kubernetes.io/version: "0.1.1"
              app.kubernetes.io/managed-by: Helm
              app.kubernetes.io/part-of: tt-operator
              app.kubernetes.io/component: aggregator
          spec:
            type: NodePort
            ports:
            - port: 8080
              targetPort: 8080
              nodePort: 30080
              name: telemetry-http
              protocol: TCP
            selector:
              app: tt-telemetry-aggregator

        - apiVersion: apps/v1
          kind: DaemonSet
          metadata:
            name: tt-telemetry-daemonset
            namespace: tt-operator-system
            labels:
              app: tt-telemetry
              helm.sh/chart: tt-telemetry-0.1.1
              app.kubernetes.io/name: tt-telemetry
              app.kubernetes.io/instance: tt-operator
              app.kubernetes.io/version: "0.1.1"
              app.kubernetes.io/managed-by: Helm
              app.kubernetes.io/part-of: tt-operator
              app.kubernetes.io/component: collector
          spec:
            updateStrategy:
              rollingUpdate:
                maxUnavailable: 25%
              type: RollingUpdate
            selector:
              matchLabels:
                app: tt-telemetry
            template:
              metadata:
                labels:
                  app: tt-telemetry
                  helm.sh/chart: tt-telemetry-0.1.1
                  app.kubernetes.io/name: tt-telemetry
                  app.kubernetes.io/instance: tt-operator
                  app.kubernetes.io/version: "0.1.1"
                  app.kubernetes.io/managed-by: Helm
                  app.kubernetes.io/part-of: tt-operator
                  app.kubernetes.io/component: collector
              spec:
                hostNetwork: true
                dnsPolicy: ClusterFirstWithHostNet
                containers:
                - name: tt-telemetry
                  image: ghcr.io/tenstorrent/tt-telemetry:0.1.1
                  command: ["/bin/sh"]
                  args:
                  - -c
                  - |
                    NODE_HOSTNAME=${NODE_NAME:-$(hostname)}
                    exec /tt-telemetry/build/bin/tt_telemetry_server
                  ports:
                  - containerPort: 8080
                    name: telemetry-http
                  env:
                  - name: NODE_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: spec.nodeName
                  resources:
                    requests:
                      memory: "128Mi"
                      cpu: "100m"
                    limits:
                      memory: "256Mi"
                      cpu: "500m"
                  securityContext:
                    privileged: true
                    capabilities:
                      add: [SYS_ADMIN, DAC_OVERRIDE, DAC_READ_SEARCH, FOWNER, FSETID,
                            KILL, SETGID, SETUID, NET_BIND_SERVICE, NET_RAW, SYS_CHROOT,
                            MKNOD, AUDIT_WRITE, SETFCAP]
                  readinessProbe:
                    httpGet:
                      path: /metrics
                      port: telemetry-http
                    initialDelaySeconds: 5
                    periodSeconds: 10
                    timeoutSeconds: 3
                    failureThreshold: 3
                  livenessProbe:
                    httpGet:
                      path: /api/status
                      port: telemetry-http
                    initialDelaySeconds: 15
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 3
                  volumeMounts:
                  - name: hugepages
                    mountPath: /dev/hugepages-1G
                  - name: umd-sockets
                    mountPath: /tmp/tt_umd_listeners
                  - name: shared-memory
                    mountPath: /dev/shm
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                      - matchExpressions:
                        - key: feature.node.kubernetes.io/pci-1200_1e52.present
                          operator: In
                          values: ["true"]
                        - key: tenstorrent.com/deploy.tt-telemetry
                          operator: NotIn
                          values: ["false"]
                tolerations: []
                volumes:
                - name: hugepages
                  hostPath:
                    path: /dev/hugepages-1G
                    type: DirectoryOrCreate
                - name: umd-sockets
                  hostPath:
                    path: /tmp/tt_umd_listeners
                    type: DirectoryOrCreate
                - name: shared-memory
                  hostPath:
                    path: /dev/shm
                    type: DirectoryOrCreate

    # tt-fabric-manager (topology agent + controller) and tt-dra-driver (kubelet plugin).
    # These provide DRA-based device access so vLLM does not need privileged mode.
    - name: tt-dra
      mode: one-time
      inline:
        - apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: tt-operator-tt-dra-driver-service-account
            namespace: tt-operator-system

        - apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: tt-fabric-manager
            namespace: tt-operator-system

        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: tt-fabric-manager-agent
            namespace: tt-operator-system
          data:
            config.yaml: |
              controller:
                listen_address: tt-fabric-manager-controller:50052

        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: tt-fabric-manager-controller
            namespace: tt-operator-system
          data:
            config.yaml: |
              controller:
                listen_address: 0.0.0.0:50052
                heartbeat_interval_sec: 10
                heartbeat_timeout_sec: 30
                daemon_reconnect_timeout_sec: 60
              otel:
                enabled: false
                service_name: "tt-fabric-manager-controller"
                metric_export_interval_sec: 10

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: tt-operator-tt-dra-driver-role
          rules:
          - apiGroups: ["resource.k8s.io"]
            resources: ["resourceclaims"]
            verbs: ["get"]
          - apiGroups: [""]
            resources: ["nodes"]
            verbs: ["get"]
          - apiGroups: ["resource.k8s.io"]
            resources: ["resourceslices"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: tt-operator-tt-dra-driver-role-binding
          subjects:
          - kind: ServiceAccount
            name: tt-operator-tt-dra-driver-service-account
            namespace: tt-operator-system
          roleRef:
            kind: ClusterRole
            name: tt-operator-tt-dra-driver-role
            apiGroup: rbac.authorization.k8s.io

        - apiVersion: v1
          kind: Service
          metadata:
            name: tt-fabric-manager-agent
            namespace: tt-operator-system
          spec:
            type: ClusterIP
            internalTrafficPolicy: Local
            ports:
              - port: 50053
                targetPort: grpc
                protocol: TCP
                name: grpc
            selector:
              app.kubernetes.io/name: tt-fabric-manager
              app.kubernetes.io/instance: tt-operator
              ttfm.tenstorrent.com/component: agent

        - apiVersion: v1
          kind: Service
          metadata:
            name: tt-fabric-manager-controller
            namespace: tt-operator-system
            annotations:
              traefik.ingress.kubernetes.io/service.serversscheme: h2c
          spec:
            type: ClusterIP
            ports:
              - port: 50052
                targetPort: grpc
                protocol: TCP
                name: grpc
            selector:
              app.kubernetes.io/name: tt-fabric-manager
              app.kubernetes.io/instance: tt-operator
              ttfm.tenstorrent.com/component: controller

        - apiVersion: apps/v1
          kind: DaemonSet
          metadata:
            name: tt-operator-tt-dra-driver-kubeletplugin
            namespace: tt-operator-system
          spec:
            selector:
              matchLabels:
                app.kubernetes.io/name: tt-dra-driver
                app.kubernetes.io/instance: tt-operator
                app.kubernetes.io/component: kubeletplugin
            updateStrategy:
              rollingUpdate:
                maxSurge: 1
                maxUnavailable: 0
              type: RollingUpdate
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: tt-dra-driver
                  app.kubernetes.io/instance: tt-operator
                  app.kubernetes.io/component: kubeletplugin
              spec:
                priorityClassName: system-node-critical
                serviceAccountName: tt-operator-tt-dra-driver-service-account
                containers:
                - name: plugin
                  securityContext:
                    privileged: true
                  image: ghcr.io/tenstorrent/tt-dra-driver:0.0.36
                  imagePullPolicy: IfNotPresent
                  command: ["tt-dra-driver-kubeletplugin"]
                  livenessProbe:
                    grpc:
                      port: 51515
                      service: liveness
                    failureThreshold: 3
                    periodSeconds: 10
                  env:
                  - name: DRIVER_NAME
                    value: "tenstorrent.com"
                  - name: DEVICE_PROFILE
                    value: "tenstorrent"
                  - name: CDI_ROOT
                    value: /var/run/cdi
                  - name: KUBELET_REGISTRAR_DIRECTORY_PATH
                    value: "/var/lib/kubelet/plugins_registry"
                  - name: KUBELET_PLUGINS_DIRECTORY_PATH
                    value: "/var/lib/kubelet/plugins"
                  - name: NODE_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: spec.nodeName
                  - name: NAMESPACE
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.namespace
                  - name: FABRIC_MANAGER_AGENT_ADDRESS
                    value: "tt-fabric-manager-agent.tt-operator-system.svc.cluster.local:50053"
                  - name: HEALTHCHECK_PORT
                    value: "51515"
                  - name: POD_UID
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.uid
                  volumeMounts:
                  - name: plugins-registry
                    mountPath: "/var/lib/kubelet/plugins_registry"
                  - name: plugins
                    mountPath: "/var/lib/kubelet/plugins"
                  - name: cdi
                    mountPath: /var/run/cdi
                volumes:
                - name: plugins-registry
                  hostPath:
                    path: "/var/lib/kubelet/plugins_registry"
                - name: plugins
                  hostPath:
                    path: "/var/lib/kubelet/plugins"
                - name: cdi
                  hostPath:
                    path: /var/run/cdi
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: tenstorrent.com/has-tt
                              operator: In
                              values: ["true"]
                        - matchExpressions:
                            - key: feature.node.kubernetes.io/pci-1200_1e52.present
                              operator: In
                              values: ["true"]

        - apiVersion: apps/v1
          kind: DaemonSet
          metadata:
            name: tt-fabric-manager-agent
            namespace: tt-operator-system
          spec:
            selector:
              matchLabels:
                app.kubernetes.io/name: tt-fabric-manager
                app.kubernetes.io/instance: tt-operator
            updateStrategy:
              type: RollingUpdate
              rollingUpdate:
                maxUnavailable: 100
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: tt-fabric-manager
                  app.kubernetes.io/instance: tt-operator
                  ttfm.tenstorrent.com/component: agent
              spec:
                serviceAccountName: tt-fabric-manager
                volumes:
                - name: config-volume
                  configMap:
                    name: tt-fabric-manager-agent
                - name: scaleout-configs
                  hostPath:
                    path: /var/tt-scaleout-configs
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: tenstorrent.com/has-tt
                              operator: In
                              values: ["true"]
                        - matchExpressions:
                            - key: feature.node.kubernetes.io/pci-1200_1e52.present
                              operator: In
                              values: ["true"]
                containers:
                  - name: tt-fabric-manager-agent
                    securityContext:
                      privileged: true
                    image: "ghcr.io/tenstorrent/tt-fabric-manager:0.2.28"
                    imagePullPolicy: IfNotPresent
                    ports:
                      - name: grpc
                        containerPort: 50053
                        protocol: TCP
                    command:
                      - "tt-fabric-manager-agent"
                      - "--host-id"
                      - "$(HOST_ID)"
                      - "--advertise-address"
                      - "$(POD_IP):50053"
                    env:
                      - name: HOST_ID
                        valueFrom:
                          fieldRef:
                            fieldPath: spec.nodeName
                      - name: POD_IP
                        valueFrom:
                          fieldRef:
                            fieldPath: status.podIP
                    livenessProbe:
                      exec:
                        command:
                        - grpc-health-probe
                        - -addr=:50053
                        - -connect-timeout=100ms
                        - -rpc-timeout=150ms
                      initialDelaySeconds: 5
                      periodSeconds: 5
                    readinessProbe:
                      exec:
                        command:
                        - grpc-health-probe
                        - -addr=:50053
                        - -connect-timeout=100ms
                        - -rpc-timeout=150ms
                      initialDelaySeconds: 5
                      periodSeconds: 5
                    volumeMounts:
                      - name: config-volume
                        mountPath: /etc/fabric-manager
                        readOnly: true
                      - name: scaleout-configs
                        mountPath: /scaleout_configs
                        readOnly: true

        - apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: tt-fabric-manager-controller
            namespace: tt-operator-system
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: tt-fabric-manager
                app.kubernetes.io/instance: tt-operator
                ttfm.tenstorrent.com/component: controller
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: tt-fabric-manager
                  app.kubernetes.io/instance: tt-operator
                  ttfm.tenstorrent.com/component: controller
              spec:
                serviceAccountName: tt-fabric-manager
                volumes:
                  - name: config-volume
                    configMap:
                      name: tt-fabric-manager-controller
                  - name: scaleout-configs
                    hostPath:
                      path: /var/tt-scaleout-configs
                containers:
                  - name: tt-fabric-manager
                    image: "ghcr.io/tenstorrent/tt-fabric-manager:0.2.28"
                    imagePullPolicy: IfNotPresent
                    ports:
                      - name: grpc
                        containerPort: 50052
                        protocol: TCP
                    command:
                      - "tt-fabric-manager-controller"
                      - "--config"
                      - "/etc/fabric-manager/config.yaml"
                    volumeMounts:
                      - name: config-volume
                        mountPath: /etc/fabric-manager
                        readOnly: true
                      - name: scaleout-configs
                        mountPath: /scaleout_configs
                        readOnly: true
                    readinessProbe:
                      exec:
                        command:
                        - grpc-health-probe
                        - -addr=:50052
                        - -connect-timeout=100ms
                        - -rpc-timeout=150ms
                      initialDelaySeconds: 5

        - apiVersion: resource.k8s.io/v1
          kind: DeviceClass
          metadata:
            name: tenstorrent.com
          spec:
            selectors:
            - cel:
                expression: "device.driver == 'tenstorrent.com'"

    # vLLM TT Metal serving Qwen/Qwen3-8B on Wormhole N300 (two chips, TP=2).
    # First run downloads weights and compiles TT Metal kernels — allow 30-60 minutes.
    - name: qwen3-8b
      mode: one-time
      inline:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: qwen3-8b

        - apiVersion: v1
          kind: Secret
          metadata:
            name: huggingface-token
            namespace: qwen3-8b
          type: Opaque
          stringData:
            token: "${HF_TOKEN}"

        - apiVersion: resource.k8s.io/v1
          kind: ResourceClaim
          metadata:
            name: vllm-tt-device
            namespace: qwen3-8b
          spec:
            devices:
              requests:
                - name: tt
                  exactly:
                    deviceClassName: tenstorrent.com

        - apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: vllm
            namespace: qwen3-8b
          spec:
            replicas: 1
            strategy:
              type: Recreate
            selector:
              matchLabels:
                app: vllm
            template:
              metadata:
                labels:
                  app: vllm
              spec:
                tolerations:
                  - key: tenstorrent.com/device
                    operator: Exists
                    effect: NoSchedule
                terminationGracePeriodSeconds: 60
                enableServiceLinks: false
                resourceClaims:
                  - name: tt
                    resourceClaimName: vllm-tt-device
                containers:
                  - name: vllm
                    image: ghcr.io/tenstorrent/tt-inference-server/vllm-tt-metal-src-release-ubuntu-22.04-amd64:0.18.0-c49bb76-6b4a3a7
                    args:
                      - "--model"
                      - "Qwen/Qwen3-8B"
                      - "--tt-device"
                      - "n300"
                      - "--no-auth"
                      - "--host"
                      - "0.0.0.0"
                      - "--port"
                      - "8000"
                      - "--enable-auto-tool-choice"
                      - "--tool-call-parser"
                      - "qwen3_json"
                    env:
                      - name: HF_TOKEN
                        valueFrom:
                          secretKeyRef:
                            name: huggingface-token
                            key: token
                      - name: CACHE_ROOT
                        value: /models
                    ports:
                      - name: http
                        containerPort: 8000
                    resources:
                      claims:
                        - name: tt
                      requests:
                        hugepages-1Gi: 28Gi
                        memory: 8Gi
                        cpu: "1"
                      limits:
                        hugepages-1Gi: 28Gi
                        memory: 12Gi
                        cpu: "4"
                    volumeMounts:
                      - name: models
                        mountPath: /models
                      - name: hugepages
                        mountPath: /dev/hugepages
                      - name: shm
                        mountPath: /dev/shm
                    startupProbe:
                      httpGet:
                        path: /health
                        port: http
                      initialDelaySeconds: 300
                      periodSeconds: 30
                      failureThreshold: 120
                    livenessProbe:
                      httpGet:
                        path: /health
                        port: http
                      periodSeconds: 30
                      timeoutSeconds: 10
                      failureThreshold: 3
                    readinessProbe:
                      httpGet:
                        path: /health
                        port: http
                      periodSeconds: 30
                      timeoutSeconds: 10
                      failureThreshold: 3
                volumes:
                  - name: models
                    hostPath:
                      path: /var/mnt/llm-models
                      type: DirectoryOrCreate
                  - name: hugepages
                    emptyDir:
                      medium: HugePages-1Gi
                  - name: shm
                    emptyDir:
                      medium: Memory
                      sizeLimit: 8Gi

        - apiVersion: v1
          kind: Service
          metadata:
            name: vllm
            namespace: qwen3-8b
          spec:
            selector:
              app: vllm
            ports:
              - name: http
                port: 8000
                targetPort: http
            type: ClusterIP

talos:
  version: v1.13.6

---
# Single control-plane node — untainted to run workloads
kind: ControlPlane
machines:
  - ${MACHINE_UUID}

systemExtensions:
  - siderolabs/tenstorrent

# 1 GB hugepages required by the TT inference server (32 × 1 GB = 32 GB)
kernelArgs:
  - hugepagesz=1G
  - hugepages=32

patches:
  - name: untaint-controlplane
    inline:
      cluster:
        allowSchedulingOnControlPlanes: true

  - name: install-disk
    inline:
      machine:
        install:
          disk: /dev/nvme0n1

  - name: llm-models-volume
    inline:
      apiVersion: v1alpha1
      kind: UserVolumeConfig
      name: llm-models
      volumeType: directory
