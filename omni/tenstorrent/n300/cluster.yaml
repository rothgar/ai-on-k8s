# Omni cluster template — single-node Tenstorrent Wormhole (N300)
# Deploys: tt-operator (NFD + device detection), vLLM (Qwen/Qwen3-8B)
#
# The siderolabs/tenstorrent system extension provides the tt-kmd kernel driver.
# Driver installation via tt-k8s-driver-manager is therefore disabled in the tt-operator manifest.
#
# Required environment variables:
#   MACHINE_UUID  — machine UUID shown in Omni UI or: omnictl get machines
#   HF_TOKEN      — HuggingFace token with access to Qwen/Qwen3-8B
#   CLUSTER_NAME  — name for the cluster (e.g. wormhole)
#
# Usage:
#   export MACHINE_UUID=<uuid>
#   export HF_TOKEN=hf_xxx
#   export CLUSTER_NAME=wormhole
#   envsubst '${MACHINE_UUID} ${HF_TOKEN} ${CLUSTER_NAME}' \
#     < omni/tenstorrent/n300/cluster.yaml > /tmp/n300-cluster.yaml
#   omnictl cluster template sync --verbose -f /tmp/n300-cluster.yaml
#
# Access vLLM after cluster is ready (first run compiles TT Metal — allow 60+ min):
#   kubectl port-forward -n qwen3-8b svc/vllm 8000:8000
#   curl http://localhost:8000/v1/models

kind: Cluster
name: ${CLUSTER_NAME}
kubernetes:
  version: v1.36.2
  manifests:

    # tt-operator v0.1.0 — rendered from oci://ghcr.io/tenstorrent/helm/tt-operator
    # Disabled: tt-k8s-driver-manager (driver handled by siderolabs/tenstorrent extension),
    #           kubepmix, jobset
    # Enabled:  node-feature-discovery, tt-telemetry, tt-fabric-manager, tt-dra-driver

    - name: tt-operator
      mode: one-time
      inline:
        - apiVersion: v1
          kind: Namespace
          metadata:
            name: tt-operator-system
            labels:
              pod-security.kubernetes.io/enforce: privileged
              pod-security.kubernetes.io/audit: privileged
              pod-security.kubernetes.io/warn: privileged

