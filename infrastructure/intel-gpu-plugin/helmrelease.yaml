apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugins-operator
  namespace: intel-device-plugins
spec:
  interval: 5m
  chart:
    spec:
      chart: intel-device-plugins-operator
      version: ">=0.30.0"
      sourceRef:
        kind: HelmRepository
        name: intel-device-plugins
        namespace: intel-device-plugins
  values: {}
---
# GpuDevicePlugin CR — tells the operator to deploy the GPU device plugin,
# which exposes gpu.intel.com/i915 on nodes with Intel GPUs.
apiVersion: deviceplugin.intel.com/v1
kind: GpuDevicePlugin
metadata:
  name: gpudeviceplugin-sample
  namespace: intel-device-plugins
spec:
  image: intel/intel-gpu-plugin:latest
  sharedDevNum: 1
