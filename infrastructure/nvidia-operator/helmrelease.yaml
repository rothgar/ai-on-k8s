apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: nvidia-system
spec:
  interval: 5m
  chart:
    spec:
      chart: gpu-operator
      version: ">=24.9.0"
      sourceRef:
        kind: HelmRepository
        name: nvidia-gpu-operator
        namespace: nvidia-system
  values:
    # Talos Linux manages NVIDIA drivers via system extensions.
    # The driver container installer must be disabled.
    driver:
      enabled: false
    toolkit:
      enabled: true
    devicePlugin:
      enabled: true
    hostPaths:
      driverInstallDir: /usr/local
    dcgmExporter:
      enabled: true
