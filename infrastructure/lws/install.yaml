# LeaderWorkerSet controller — required for multi-node model deployments.
# This installs from the upstream release. Pin the tag for production use.
#
# To install directly without Flux:
#   kubectl apply --server-side \
#     -f https://github.com/kubernetes-sigs/lws/releases/latest/download/manifests.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: lws-system
---
# Flux users: reference the upstream GitRepository instead of embedding manifests.
# ArgoCD users: create an Application pointing at the upstream repo path ./config/default.
#
# The manifest below is a convenience resource for clusters without Flux/ArgoCD that
# can run: kubectl apply -k infrastructure/lws/
# It installs CRDs and controller from the official release tag.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lws
  namespace: lws-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: lws-upstream
  path: ./config/default
  prune: true
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: lws-upstream
  namespace: lws-system
spec:
  interval: 1h
  url: https://github.com/kubernetes-sigs/lws
  ref:
    tag: v0.6.1
