name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - catalog.yaml
      - docs/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate catalog.json
        run: |
          python3 - <<'EOF'
          import yaml, json
          with open('catalog.yaml') as f:
              data = yaml.safe_load(f)
          with open('docs/catalog.json', 'w') as f:
              json.dump(data, f)
          print(f"Generated catalog.json with {len(data['entries'])} entries")
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - uses: actions/deploy-pages@v4
        id: deploy
