apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
spec:
  template:
    spec:
      containers:
        - name: vllm
          command:
            - vllm
            - serve
            - Qwen/Qwen3.6-35B-A3B-FP8
            - --download-dir
            - /models
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --served-model-name
            - qwen3-35b
            - qwen3.6-35b-a3b
            - --tensor-parallel-size
            - "4"
            - --gpu-memory-utilization
            - "0.90"
            - --max-model-len
            - "65536"
            - --max-num-seqs
            - "20"
            - --max-num-batched-tokens
            - "32768"
            - --enable-prefix-caching
            - --enable-auto-tool-choice
            - --tool-call-parser
            - qwen3_coder
            - --reasoning-parser
            - qwen3
            - --trust-remote-code
          resources:
            limits:
              nvidia.com/gpu: "4"
