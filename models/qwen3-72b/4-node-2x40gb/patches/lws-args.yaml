apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: vllm
spec:
  leaderWorkerTemplate:
    size: 4
    leaderTemplate:
      spec:
        containers:
          - name: vllm
            command:
              - bash
              - -c
              - |
                vllm serve Qwen/Qwen3-72B \
                  --download-dir /models \
                  --host 0.0.0.0 \
                  --port 8000 \
                  --served-model-name qwen3-72b \
                  --tensor-parallel-size 2 \
                  --pipeline-parallel-size $(LWS_GROUP_SIZE) \
                  --node-rank 0 \
                  --master-addr $(LWS_LEADER_ADDRESS) \
                  --master-port 29500 \
                  --gpu-memory-utilization 0.90 \
                  --max-model-len 32768 \
                  --enable-prefix-caching \
                  --enable-auto-tool-choice \
                  --tool-call-parser qwen3_json \
                  --reasoning-parser qwen3 \
                  --trust-remote-code
            resources:
              limits:
                nvidia.com/gpu: "2"
    workerTemplate:
      spec:
        containers:
          - name: vllm
            command:
              - bash
              - -c
              - |
                vllm serve Qwen/Qwen3-72B \
                  --download-dir /models \
                  --tensor-parallel-size 2 \
                  --pipeline-parallel-size $(LWS_GROUP_SIZE) \
                  --node-rank $(LWS_WORKER_INDEX) \
                  --master-addr $(LWS_LEADER_ADDRESS) \
                  --master-port 29500 \
                  --gpu-memory-utilization 0.90 \
                  --headless \
                  --trust-remote-code
            resources:
              limits:
                nvidia.com/gpu: "2"
