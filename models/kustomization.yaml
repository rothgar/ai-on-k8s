apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Single-node models
  - qwen3-4b/1x8gb
  - qwen3-8b/1x16gb
  - qwen3-14b/1x40gb
  - qwen3-35b/1x128gb
  - gemma-4-2b-it/1x8gb
  - gemma-4-9b-it/1x24gb
  - gemma-4-27b-it/1x80gb
  - gpt-oss-120b/1x128gb
