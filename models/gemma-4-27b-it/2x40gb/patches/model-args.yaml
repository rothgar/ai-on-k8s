apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
spec:
  template:
    spec:
      containers:
        - name: vllm
          command:
            - vllm
            - serve
            - google/gemma-4-27b-it
            - --download-dir
            - /models
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --served-model-name
            - gemma-4-27b-it
            - --tensor-parallel-size
            - "2"
            - --gpu-memory-utilization
            - "0.90"
            - --max-model-len
            - "65536"
            - --enable-prefix-caching
          resources:
            limits:
              nvidia.com/gpu: "2"
