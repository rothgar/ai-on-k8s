apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
spec:
  template:
    spec:
      containers:
        - name: vllm
          image: nvcr.io/nvidia/vllm:26.06-py3
          command:
            - vllm
            - serve
            - openai/gpt-oss-120b
            - --download-dir
            - /models
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --served-model-name
            - gpt-oss-120b
            - --tool-call-parser
            - openai
            - --reasoning-parser
            - openai_gptoss
            - --enable-auto-tool-choice
            - --quantization
            - mxfp4
            - --kv-cache-dtype
            - fp8
            - --gpu-memory-utilization
            - "0.85"
            - --max-num-batched-tokens
            - "8192"
            - --enable-prefix-caching
          env:
            - name: VLLM_USE_FLASHINFER_MOE_MXFP4_MXFP8_CUTLASS
              value: "1"
          resources:
            limits:
              nvidia.com/gpu: "1"
